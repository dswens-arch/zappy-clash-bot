name: Sync Zappy Images

# Manually triggered from the Actions tab -- click "Run workflow." Runs
# on GitHub's own servers (full outbound internet access), so nothing
# needs to be installed or configured locally.
#
# What it does: downloads every Zappy/Hero/Collab image from a live IPFS
# gateway ONCE, resizes it, saves it into zappy-images-full/ in this repo,
# and rewrites zappy_collection.py + algorand_lookup.py to point at those
# local files instead of any IPFS URL. After this runs once, the bot never
# depends on an external gateway -- or AlgoNode's IPFS gateway, which also
# counts against the same daily quota as payouts/wallet lookups -- being
# up at render time again.
#
# Safe to re-run later too (e.g. after new Zappies mint) -- it just
# downloads whatever's missing and re-rewrites, only committing if
# something actually changed.

on:
  workflow_dispatch: {}
  # Uncomment to also run automatically on a schedule (e.g. to pick up
  # newly-minted Zappies without a manual trigger each time):
  # schedule:
  #   - cron: '0 6 * * 1'  # every Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Download and process images
        run: python download_zappy_images.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zappy-images-full/ zappy_collection.py algorand_lookup.py zappy_image_sources.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Sync self-hosted Zappy images"
          git push
