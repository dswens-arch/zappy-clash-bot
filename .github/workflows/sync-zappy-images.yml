name: Sync Zappy Images

# Manually triggered from the Actions tab -- click "Run workflow." Runs
# on GitHub's own servers (full outbound internet access), so nothing
# needs to be installed or configured locally.
#
# What it does:
#   1. Downloads any of the original ~1,690 Zappy/Hero/Collab images not
#      yet self-hosted, saves into zappy-images-full/, rewrites
#      zappy_collection.py + algorand_lookup.py to point at the local files.
#   2. Downloads any NEW mint sitting in the extra_zappies Supabase table
#      (added via /addzappies or /settraits in Discord) that isn't
#      self-hosted yet, and updates its image_url in Supabase directly.
#
# Safe to re-run any time -- only touches what's missing/outdated, only
# commits if something actually changed.

on:
  workflow_dispatch: {}
  # Uncomment to also run automatically on a schedule:
  # schedule:
  #   - cron: '0 6 * * 1'  # every Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Download and process images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python download_zappy_images.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zappy-images-full/ zappy_collection.py algorand_lookup.py zappy_image_sources.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Sync self-hosted Zappy images"
          git push
